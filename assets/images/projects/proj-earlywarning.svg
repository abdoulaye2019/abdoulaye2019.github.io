<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Aperçu du système d'alerte précoce climat et déplacements">
  <rect width="800" height="520" fill="#F4F1E9"/>
  <g stroke="#0072BC" stroke-width="1" opacity="0.06">
    <path d="M0 130H800M0 260H800M0 390H800M130 0V520M270 0V520M410 0V520M550 0V520M690 0V520"/>
  </g>
  <!-- panel -->
  <rect x="64" y="58" width="672" height="404" rx="16" fill="#FFFFFF" stroke="#E6E0D4"/>
  <!-- graticule globe -->
  <g transform="translate(250 270)">
    <circle r="150" fill="#EAF2F9" stroke="#0072BC" stroke-opacity="0.35"/>
    <g stroke="#0072BC" stroke-opacity="0.30" fill="none">
      <ellipse rx="150" ry="52"/><ellipse rx="150" ry="102"/>
      <ellipse rx="52" ry="150"/><ellipse rx="102" ry="150"/>
      <line x1="-150" y1="0" x2="150" y2="0"/><line x1="0" y1="-150" x2="0" y2="150"/>
    </g>
    <!-- rainfall / risk band -->
    <path d="M-120 30 Q -40 -10 40 26 T 150 18" stroke="#0072BC" stroke-width="3" fill="none"/>
    <path d="M-130 70 Q -40 30 50 66 T 150 58" stroke="#0072BC" stroke-width="2" stroke-opacity="0.6" fill="none"/>
    <!-- alert nodes -->
    <circle cx="-46" cy="-30" r="9" fill="#C0561F"/>
    <circle cx="64" cy="40" r="7" fill="#C0561F"/>
    <circle cx="22" cy="-72" r="6" fill="#E2B23C"/>
  </g>
  <!-- side readout -->
  <g font-family="'IBM Plex Mono',monospace">
    <rect x="470" y="104" width="226" height="312" rx="12" fill="#0E1B2A"/>
    <text x="492" y="140" font-size="12" fill="#7FA8CC">EARLY-WARNING · WCA</text>
    <rect x="492" y="158" width="182" height="1" fill="#27405C"/>
    <text x="492" y="192" font-size="12" fill="#C6CED6">Sentinel-1 / 2</text>
    <text x="492" y="220" font-size="12" fill="#C6CED6">CHIRPS · rainfall</text>
    <text x="492" y="248" font-size="12" fill="#C6CED6">SMAP · soil moisture</text>
    <text x="492" y="276" font-size="12" fill="#C6CED6">MODIS · land</text>
    <rect x="492" y="300" width="182" height="40" rx="8" fill="#3A1B12"/>
    <circle cx="514" cy="320" r="7" fill="#C0561F"/>
    <text x="532" y="325" font-size="12" fill="#F0C0A6">RISK ALERT · displacement</text>
    <rect x="492" y="352" width="120" height="10" rx="5" fill="#0072BC"/>
    <rect x="492" y="372" width="160" height="10" rx="5" fill="#1E3550"/>
  </g>
  <text x="64" y="496" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#6B7884">Google Earth Engine · télédétection · ML — concept COP30</text>
</svg>
